<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="" >
        <div class="div one">
            <label for="">Principal (original amount)</label>
            <input type="number" class="principal">
        </div>
        <div class="div two">
            <label for="">Rate of interest (% per year)</label>
            <input type="number" class="rate">
        </div>
        <div class="div three">
            <label for="">Time (years)</label>
            <input type="number" class="time">
        </div>
        <div class="div four">
            <label for="">Amount after interest</label>
            <input type="number" class="amount">
        </div>
        <div class="div five" >
            <input type="button" class="btn" value="Calculate" >
        </div>
        <p class="para"></p>
    </form>
    <script src="script.js"></script>
</body>
</html>
