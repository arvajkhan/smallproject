<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Reverse Array</h1>
    <input type="text" class="value">
    <button onclick="btn()">Reverse</button>
    <p class="para"></p>
    <script>
        function btn(){
            let value = document.querySelector(".value").value;
            let para = document.querySelector(".para");
            let arr = value.split(" ");
            arr.reverse();
            para.innerHTML = "Reverse Array :" +  arr;
        }
    </script>
</body>
</html>
