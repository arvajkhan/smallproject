<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart System</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

#search {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
}

#product-list {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    width: 220px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    text-align: center;
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
}

button {
    padding: 5px 10px;
    margin: 5px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
}

.buy {
    background: green;
    color: white;
}

.sell {
    background: red;
    color: white;
}
</style>

</head>
<body>

<h1>Shopping Cart</h1>

<input type="text" id="search" placeholder="Search by name or brand">

<div id="product-list"></div>

<script>
// Product data with images
const products = [
    {
        id: 1,
        name: "Shoes",
        brand: "Nike",
        price: 2000,
        quantity: 1,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff"
    },
    {
        id: 2,
        name: "T-Shirt",
        brand: "Puma",
        price: 800,
        quantity: 1,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
    },
    {
        id: 3,
        name: "Watch",
        brand: "Fossil",
        price: 5000,
        quantity: 1,
        image: "https://images.unsplash.com/photo-1519741497674-611481863552"
    },
    {
        id: 4,
        name: "Shoes",
        brand: "Adidas",
        price: 2500,
        quantity: 1,
        image: "https://images.unsplash.com/photo-1600180758890-6b94519a8ba6"
    }
];

let filteredProducts = [...products];

// Display products
function displayProducts(data) {
    const container = document.getElementById("product-list");
    container.innerHTML = "";

    data.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${item.image}" alt="${item.name}">
            <h3>${item.name}</h3>
            <p>Brand: ${item.brand}</p>
            <p>Price: ₹${item.price}</p>
            <p>Quantity: ${item.quantity}</p>
            <button class="buy" onclick="buy(${index})">Buy</button>
            <button class="sell" onclick="sell(${index})">Sell</button>
        `;

        container.appendChild(card);
    });
}

// Buy
function buy(index) {
    filteredProducts[index].quantity++;
    displayProducts(filteredProducts);
}

// Sell
function sell(index) {
    if (filteredProducts[index].quantity > 0) {
        filteredProducts[index].quantity--;
        displayProducts(filteredProducts);
    }
}

// Search filter
document.getElementById("search").addEventListener("input", function () {
    const value = this.value.toLowerCase();

    filteredProducts = products.filter(item =>
        item.name.toLowerCase().includes(value) ||
        item.brand.toLowerCase().includes(value)
    );

    displayProducts(filteredProducts);
});

// Initial load
displayProducts(products);
</script>

</body>
</html>
