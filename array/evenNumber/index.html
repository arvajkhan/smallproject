<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Even Number</h1>
    <input type="text" class="value" placeholder="Enter the Value 2 4 5 6">
    <button class="btn" onclick="btn()">Calculate</button>
    <p class="para"></p>
    <script>
        function btn(){
            let value = document.querySelector(".value").value
            let para = document.querySelector(".para");
            let array = value.split(" ");
            let result = [];
            array.forEach(element => {
                let num = Number(element)
                if(num % 2 === 0){
                    result.push(num);
                }
            });
            para.innerHTML = "This is Even Numbers : " + result.join(", ")
        }
    </script>
</body>
</html>
