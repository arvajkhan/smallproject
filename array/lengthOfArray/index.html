<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" class="value">
    <button onclick="btn()">Array Length</button>
    <p class="para"></p>
    <script>
        function btn(){
            let value = document.querySelector(".value").value;
            let para =  document.querySelector(".para")
            let arr = value.split(" ");
            para.innerHTML = "This is Length  Of Array : " + arr.length;
        
        }
    </script>
</body>
</html>
